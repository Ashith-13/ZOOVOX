version: "3.9"

services:

  api:
    build: .
    container_name: zoovox_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./models:/app/models:ro    # Mount pre-trained model files
      - audio_tmp:/tmp/zoovox_audio
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - zoovox_net

  redis:
    image: redis:7-alpine
    container_name: zoovox_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - zoovox_net

  # Optional: local MongoDB for development (use Atlas in production)
  mongo:
    image: mongo:7
    container_name: zoovox_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: zoovox
      MONGO_INITDB_ROOT_PASSWORD: zoovox_dev_pass
      MONGO_INITDB_DATABASE: zoovox
    volumes:
      - mongo_data:/data/db
    networks:
      - zoovox_net

  # Nginx reverse proxy (production)
  nginx:
    image: nginx:alpine
    container_name: zoovox_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api
    networks:
      - zoovox_net
    profiles:
      - production

volumes:
  mongo_data:
  audio_tmp:

networks:
  zoovox_net:
    driver: bridge
